version: "3.9"

services:

  vihaan-app:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: vihaan-writes-publication

    restart: unless-stopped

    expose:
      - "3000"

    networks:
      - vihaan-network

  nginx:
    image: nginx:stable-alpine

    container_name: vihaan-nginx

    depends_on:
      - vihaan-app

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    restart: unless-stopped

    networks:
      - vihaan-network

  prometheus:
    image: prom/prometheus

    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

    restart: unless-stopped

    networks:
      - vihaan-network

  grafana:
    image: grafana/grafana

    container_name: grafana

    ports:
      - "3001:3000"

    restart: unless-stopped

    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning

    depends_on:
      - prometheus

    networks:
      - vihaan-network

  node-exporter:
    image: prom/node-exporter

    container_name: node-exporter

    restart: unless-stopped

    ports:
      - "9100:9100"

    networks:
      - vihaan-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest

    container_name: cadvisor

    restart: unless-stopped

    privileged: true

    ports:
      - "8080:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

    networks:
      - vihaan-network

networks:
  vihaan-network:

volumes:
  grafana-storage: