name: Deploy Vihaan Writes Publication

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Application
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
          -f docker/Dockerfile \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/vihaan-writes-publication:latest .

      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/vihaan-writes-publication:latest

      - name: Deploy to Ubuntu Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ~/vihaan-writes-publication

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/vihaan-writes-publication:latest

            docker compose down

            docker compose up -d

            docker image prune -af

      - name: Health Check
        run: |
          sleep 15
          curl --fail http://${{ secrets.SERVER_HOST }} || exit 1